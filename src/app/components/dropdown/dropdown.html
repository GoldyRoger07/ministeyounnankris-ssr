<div class="dropdown" routerLinkActive="is-active">
  <button
    type="button"
    class="dropdown-trigger relative flex items-center gap-1 text-sm font-semibold text-(--brand-secondary) transition-colors hover:text-(--brand-primary)"
    aria-haspopup="true"
  >
    <span>{{ label() }}</span>
    <i class="fa-solid fa-chevron-down text-xs" aria-hidden="true"></i>
  </button>

  <ul class="dropdown-menu">
    @for (item of items(); track item.url) {
      <li>
        <a [routerLink]="item.url" routerLinkActive="is-active">{{ item.label }}</a>
      </li>
    }
  </ul>
</div>
