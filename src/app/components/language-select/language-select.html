<button
  type="button"
  class="language-trigger"
  [class.is-open]="open()"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="listId"
  [attr.aria-activedescendant]="open() ? listId + '-' + options[activeIndex()].code : null"
  [attr.aria-label]="label() + ' : ' + current().name"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
>
  <i class="fa-solid fa-globe text-sm" aria-hidden="true"></i>
  <span [attr.lang]="current().code">{{ current().name }}</span>
  <i class="fa-solid fa-chevron-down language-chevron text-xs" aria-hidden="true"></i>
</button>

<ul
  [id]="listId"
  role="listbox"
  class="language-list"
  [class.is-open]="open()"
  [class.opens-up]="direction() === 'up'"
  [attr.aria-label]="label()"
  tabindex="-1"
>
  @for (option of options; track option.code; let i = $index) {
    <li
      #optionEl
      role="option"
      [id]="listId + '-' + option.code"
      [attr.lang]="option.code"
      [attr.aria-selected]="option.code === current().code"
      class="language-option"
      [class.is-active]="i === activeIndex()"
      (mouseenter)="activeIndex.set(i)"
      (mousedown)="$event.preventDefault()"
      (click)="select(option.code)"
    >
      <span>{{ option.name }}</span>
      @if (option.code === current().code) {
        <i class="fa-solid fa-check text-xs" aria-hidden="true"></i>
      }
    </li>
  }
</ul>
