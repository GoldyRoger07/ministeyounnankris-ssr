<section class="min-h-[80vh] bg-cover bg-center pt-24 pb-16 text-gray-900 flex items-center justify-center" style="background-image: linear-gradient(to bottom, white, rgb(255 255 255 / 0.15) 10%, white 92%), url('/img/about/Family Bible Reading in a Bright Living Room.webp');">
    <my-container>
        <div class="flex flex-col gap-5 items-center text-center">
            <span class="text-red-700 font-bold text-xs tracking-[0.25em]">{{content().code}}</span>
            <h1 class="font-extrabold text-4xl sm:text-5xl lg:text-6xl leading-tight text-gray-800">{{content().title}}</h1>
            <p class="text-base sm:text-lg text-gray-700 leading-relaxed max-w-2xl">{{content().lead}}</p>
            <a [routerLink]="language.localize('/')" class="mt-2 font-bold cursor-pointer py-4 px-7.5 rounded-2xl bg-amber-500 text-white shadow-lg shadow-amber-500/25 hover:bg-amber-600 transition-colors w-full sm:w-auto">
                <i class="fa-solid fa-arrow-left mr-2 text-sm" aria-hidden="true"></i>
                {{content().back}}
            </a>
        </div>
    </my-container>
</section>
